name: Database migrations

# Applies Alembic migrations to the production database whenever the schema changes on main.
# Requires the repository secret DATABASE_URL (the Neon connection string).
on:
  push:
    branches: [main]
    paths: ["backend/alembic/**", "backend/app/models.py"]
  workflow_dispatch:

concurrency: migrations

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Skip when DATABASE_URL is not configured
        id: guard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL secret not set; skipping."; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - if: steps.guard.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head
